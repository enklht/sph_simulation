<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>SPH Fluid Simulation</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <canvas id="glcanvas" tabindex="1"></canvas>

    <div class="header">SPH Fluid Demo</div>

    <div class="overlay" id="overlay">
      <div class="card">
        <h1>Fluid Simulation</h1>

        <p>Smoothed Particle Hydrodynamics running in WebAssembly.</p>

        <div class="notice">
          High-intensity demo. It may increase CPU usage, battery drain, and
          device temperature.
        </div>

        <button id="start">Start Simulation</button>

        <div class="footer">Motion control enabled on supported devices</div>
      </div>
    </div>

    <script src="https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js"></script>

    <script>
      let accel_x = 0.0;
      let accel_y = 10.0;
      let accel_z = 0.0;

      function isIOS() {
        return (
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
        );
      }

      async function start() {
        document.getElementById("overlay").remove();

        // iOS permission
        if (
          typeof DeviceMotionEvent !== "undefined" &&
          typeof DeviceMotionEvent.requestPermission === "function"
        ) {
          const res = await DeviceMotionEvent.requestPermission();
          if (res !== "granted") {
            alert("Motion permission denied");
            return;
          }
        }

        window.addEventListener("devicemotion", (event) => {
          const g = event.accelerationIncludingGravity;
          if (!g) return;

          accel_x = g.x ?? 0.0;
          accel_y = g.y ?? 10.0;
          accel_z = g.z ?? 0.0;

          if (isIOS()) {
            accel_x *= -1;
            accel_y *= -1;
            accel_z *= -1;
          }
        });

        register_plugin = function (importObject) {
          importObject.env.get_accel_x = () => accel_x;
          importObject.env.get_accel_y = () => accel_y;
          importObject.env.get_accel_z = () => accel_z;
        };

        miniquad_add_plugin({ register_plugin });

        load("./sph_simulation.wasm");
      }

      document.getElementById("start").onclick = start;
    </script>
  </body>
</html>
